{# Reusable three-dots dropdown menu for question actions #}
{% if user.is_authenticated %}
  {% if question.owner == user or user.is_superuser %}
<div class="dropdown dropdown-end">
  <button type="button" tabindex="0" class="btn btn-ghost btn-sm btn-circle" aria-label="Question options for {{ question.title }}">
    <i class="fas fa-ellipsis-v" aria-hidden="true"></i>
  </button>
  <ul tabindex="0" role="menu" class="dropdown-content menu bg-base-100 rounded-box z-[1] w-52 p-2 shadow">
    <li>
      <a href="{% url 'questions:detail' pk=question.pk %}" class="text-info font-semibold" role="menuitem">
        <i class="fas fa-eye mr-2" aria-hidden="true"></i>View Details
      </a>
    </li>
    <li>
      <a href="{% url 'questions:edit' pk=question.pk %}" class="text-secondary font-semibold" role="menuitem">
        <i class="fas fa-edit mr-2" aria-hidden="true"></i>Edit Question
      </a>
    </li>
    <li>
      <form method="post" action="{% url 'questions:delete' pk=question.pk %}"
            onsubmit="return confirm('Are you sure you want to delete this question? This action cannot be undone{% if question.answer_count > 0 %} and will also delete {{ question.answer_count }} answer{{ question.answer_count|pluralize }}{% endif %}.')">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline btn-error" role="menuitem">
          <i class="fas fa-trash mr-2" aria-hidden="true"></i>Delete Question
        </button>
      </form>
    </li>
  </ul>
</div>
  {% endif %}
{% endif %}
